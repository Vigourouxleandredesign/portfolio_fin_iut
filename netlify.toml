# Netlify build — single site: public portfolio + password-protected jury area (/jury/*)
# The jury credential is NOT here: create the env var JURY_BASIC_AUTH (value: user, colon, long password) in
# Netlify › Site configuration › Environment variables (scope: Builds). See docs/SECURITY.md §0.
[build]
  # Deploy only what passes the checks: a high/critical advisory or a red test FAILS the build, and the
  # live site stays on the last healthy deploy. `gate` = types + secrets + tests + build.
  command = "npm run audit:ci && npm run gate && node scripts/inject-jury-auth.mjs"
  publish = "dist"

[build.environment]
  # Same major as .nvmrc and the GitHub Actions CI: production is built by the tested Node version.
  NODE_VERSION = "22"
  # Git hooks are a local CI gate; never install them on the build machine.
  HUSKY = "0"
