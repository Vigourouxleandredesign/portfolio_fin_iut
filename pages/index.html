<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <meta
      name="description"
      content="Portfolio développeur et designer — projets, expérimentations et contact."
    />
    <meta property="og:title" content="Portfolio" />
    <meta
      property="og:description"
      content="Portfolio développeur et designer — projets, expérimentations et contact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-header__nav" aria-label="Navigation principale">
        <a class="site-header__logo" href="/">Portfolio</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" data-hero-reveal aria-label="Accueil">
        <div class="hero__media">
          <img
            class="hero__image hero__image--base"
            src=""
            alt="Portrait designer — buste en marbre"
            width="1080"
            height="1920"
            decoding="async"
          />
          <canvas class="hero__canvas" aria-hidden="true"></canvas>
        </div>
        <div class="hero__content">
          <h1 class="hero__title">Développeur &amp; designer</h1>
          <p class="hero__lead">
            Survole pour révéler — glisse sur mobile. Contenu indexable en HTML.
          </p>
          <p class="hero__hint hero__hint--hover">Survole le buste</p>
          <p class="hero__hint hero__hint--drag">Glisse sur le buste</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="site-footer__copy">&copy; <span data-year></span> Portfolio</p>
    </footer>

    <script type="module" src="/src/scripts/entries/home.ts"></script>
  </body>
</html>
