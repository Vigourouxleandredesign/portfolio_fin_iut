<!--
  @file Legacy hero — archived canvas-brush reveal
  @description Not in public nav/sitemap. Kept for reference/safety when the home hero
    was replaced by the 3D fractured bust (features/three-scene/). Same markup, CSS
    (hero.css) and TS (features/hero-reveal/) as the original home hero — nothing deleted,
    only relocated. See docs/ROADMAP.md Phase E decision log (2026-08-07).
  @route /hero-legacy.html (unlisted)
-->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero (archive) — Léandre</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Archive — ancien hero canvas brush reveal, remplacé par le buste 3D fracturé sur la page d'accueil."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo-leandre.svg" />
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>

    <header class="site-header">
      <nav class="site-header__nav" aria-label="Navigation principale">
        <a class="site-header__logo" href="/pages/index.html" aria-label="Léandre — Accueil">
          <img
            class="site-header__logo-image"
            data-site-logo
            src="/logo-leandre.svg"
            alt=""
            width="91"
            height="91"
            decoding="async"
          />
        </a>
        <button
          class="site-header__toggle"
          type="button"
          data-nav-toggle
          aria-expanded="false"
          aria-controls="main-nav"
          hidden
        >
          <span class="visually-hidden">Ouvrir le menu</span>
          <span class="site-header__toggle-bar" aria-hidden="true"></span>
          <span class="site-header__toggle-bar" aria-hidden="true"></span>
          <span class="site-header__toggle-bar" aria-hidden="true"></span>
        </button>
        <ul class="site-header__list" id="main-nav" data-nav-list>
          <li>
            <a class="site-header__link" href="/pages/index.html">Accueil</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <section class="hero" data-hero-reveal aria-label="Présentation (archive)">
        <div class="hero__media">
          <img
            class="hero__image hero__image--base"
            src=""
            alt="Buste sculpté représentant la facette designer"
            width="1080"
            height="1920"
            decoding="async"
            fetchpriority="high"
          />
          <!-- Creative sits under the canvas: revealed by the brush with the designer bust. -->
          <h1 class="hero__headline">
            <span class="hero__word hero__word--developer">Developer</span>
            <span class="hero__word hero__word--creative">Creative</span>
          </h1>
          <canvas class="hero__canvas" aria-hidden="true"></canvas>
        </div>
        <p class="hero__hint hero__hint--hover">Survole pour révéler</p>
        <p class="hero__hint hero__hint--drag">Glisse pour révéler</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__tagline">Archive — ancien hero, remplacé sur /pages/index.html.</p>
        <nav aria-labelledby="footer-nav-title">
          <h2 class="site-footer__heading" id="footer-nav-title">Plan du site</h2>
          <ul class="site-footer__nav">
            <li><a class="site-footer__link" href="/pages/index.html">Accueil</a></li>
          </ul>
        </nav>
      </div>
      <div class="site-footer__bottom">
        <p class="site-footer__copy">
          &copy; <span data-year></span> Léandre — Creative developer
        </p>
      </div>
    </footer>

    <script type="module" src="/src/scripts/entries/hero-legacy.ts"></script>
  </body>
</html>
